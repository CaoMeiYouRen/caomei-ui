version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: monthly
      timezone: Asia/Shanghai
      time: "04:00"
    # 版本更新只保留 patch / minor，major 转人工处理；安全更新不受 update-types 限制。
    # 规则与推导见 docs/standards/github-collaboration.md §3，一致性由 check:dependabot-policy 守卫。
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    # Playwright 的 Chromium 随 minor 升级，会改变拉丁文本排版 / 字形栅格化，使冻结的视觉基线陈旧
    # （2026-11-14 周回归实测）。minor 转人工：升级 PR 必须与视觉基线重冻结同批，
    # 见 docs/standards/testing.md「基线生成环境纪律」。
    ignore:
      - dependency-name: "@playwright/test"
        update-types:
          - "version-update:semver-minor"
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Asia/Shanghai
    allow:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
