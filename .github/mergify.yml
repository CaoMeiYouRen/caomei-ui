# Mergify 配置。
#
# 关键点：`check-success` 匹配的是 GitHub Actions 的 **job name**（`jobs.<id>.name`），
# 而不是 workflow name。本仓库 Test 工作流的 job 为 `Quality` 与 `Test & Build`
# （见 .github/workflows/test.yml）；此前误用 workflow 名 `Test`，导致规则条件永不满足。
# 参考：https://docs.mergify.com/conditions
pull_request_rules:
  - name: automatic merge for Dependabot pull requests
    conditions:
      - base = master
      - author = dependabot[bot]
      - label = dependencies
      - -draft
      - check-success = Quality
      - check-success = Test & Build
    actions:
      merge:
        method: rebase
