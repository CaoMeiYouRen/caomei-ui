name: Downstream Compat

# 下游兼容性回归（**上游触发 + 上游执行**）。
#
# 形态：caomei-ui 自身的工作流 checkout 已接入下游源码，在**上游 runner** 上执行其
# `typecheck` + `build`，验证 caomei-ui 的新版本不破坏下游构建。相较「下游 `uses:` 调用
# reusable workflow」，本形态**无需下游改动**、触发与结果全在上游可控（下游仓库须为公开，
# 上游 checkout 无需额外凭据）。
#
# 受检清单（**接入即登记**）：见 `strategy.matrix.include`——新增下游即在此登记
# （`repository` / `target-package` / `setup-command` / `typecheck-command` / `build-command`）。
#
# 边界与口径（权威见 docs/guide/release.md §10）：
# - 检查范围**最低 `typecheck` + `build`**，不含 e2e / 视觉回归 / 全量单测 / 覆盖率。
# - 触发：caomei-ui **发布 tag（`v*`）** 自动触发；另可 `workflow_dispatch` 手动（可传被测版本）。
# - **下游默认分支是移动目标**：本工作流记录下游 revision（SHA）到 job summary，便于归因；
#   红可能是下游自身改动所致（非 caomei-ui 回归）。
# - 需复刻下游构建链（命令漂移风险由上游承担）；下游改命令可能使本检查失效。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      caomei-ui-version:
        description: 被测 caomei-ui 版本（留空则取 registry latest；tag 触发时取 tag 版本）
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compat:
    name: Compat / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dependfix
            repository: dependfix/dependfix
            target-package: '@dependfix/platform'
            setup-command: |
              pnpm --filter @dependfix/core build
              pnpm --filter @dependfix/engine build
              pnpm --filter dependfix build
              pnpm --filter @dependfix/platform exec nuxt prepare
            typecheck-command: pnpm --filter @dependfix/platform typecheck
            build-command: pnpm --filter @dependfix/platform build
    steps:
      - name: Checkout caomei-ui (for toolchain metadata)
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # 下游须在 `Setup Node.js` **之前**检出：`cache-dependency-path` 指向 `downstream/pnpm-lock.yaml`，
      # `actions/setup-node` 解析该路径失败会直接报错退出。
      - name: Checkout downstream (${{ matrix.name }})
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: downstream
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: downstream/pnpm-lock.yaml
      - name: Resolve target version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.caomei-ui-version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(npm view caomei-ui version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target caomei-ui version: $version"
      - name: Record downstream revision
        shell: bash
        working-directory: downstream
        run: |
          sha="$(git rev-parse HEAD)"
          echo "### ${{ matrix.name }} @ ${sha}" >> "$GITHUB_STEP_SUMMARY"
          echo "downstream ${{ matrix.repository }} @ $sha (caomei-ui target: ${{ steps.version.outputs.version }})"
      - name: Install downstream dependencies
        working-directory: downstream
        run: pnpm i --frozen-lockfile
      - name: Override caomei-ui to target version
        working-directory: downstream
        env:
          CAOMEI_UI_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter ${{ matrix.target-package }} add "caomei-ui@$CAOMEI_UI_VERSION"
      - name: Setup downstream build chain
        working-directory: downstream
        run: ${{ matrix.setup-command }}
      - name: Typecheck downstream
        working-directory: downstream
        run: ${{ matrix.typecheck-command }}
      - name: Build downstream
        working-directory: downstream
        run: ${{ matrix.build-command }}
