name: Downstream Compat

# 下游兼容性回归（**上游触发 + 上游执行**）。
#
# 形态：caomei-ui 自身的工作流 checkout 已接入下游源码，在**上游 runner** 上执行其
# `typecheck` + `build`，验证 caomei-ui 的新版本不破坏下游构建。相较「下游 `uses:` 调用
# reusable workflow」，本形态**无需下游改动**、触发与结果全在上游可控（下游仓库须为公开，
# 上游 checkout 无需额外凭据）。
#
# 受检清单（**接入即登记**）：见 `strategy.matrix.include`——新增下游即在此登记
# （`repository` / `target-package` / `setup-command` / `typecheck-command` / `build-command` /
# `timeout-minutes`）。各下游的 setup 差异（workspace 子包预构建、Nuxt prepare）在该条目内声明。
#
# 边界与口径（权威见 docs/guide/release.md §10）：
# - 检查范围**最低 `typecheck` + `build`**，不含 e2e / 视觉回归 / 全量单测 / 覆盖率。
# - 触发：caomei-ui **发布 tag（`v*`）** 自动触发；另可 `workflow_dispatch` 手动（可传被测版本）。
# - **下游默认分支是移动目标**：本工作流记录下游 revision（SHA）到 job summary，便于归因；
#   红可能是下游自身改动所致（非 caomei-ui 回归）。
# - 需复刻下游构建链（命令漂移风险由上游承担）；下游改命令可能使本检查失效。
# - override 后断言实际安装版本 == 目标版本（fail-closed），避免「命令成功但未重装生效」。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      caomei-ui-version:
        description: 被测 caomei-ui 版本（留空则取 registry latest；tag 触发时取 tag 版本）
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compat:
    name: Compat / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dependfix
            repository: dependfix/dependfix
            target-package: '@dependfix/platform'
            timeout-minutes: 30
            setup-command: |
              pnpm --filter @dependfix/core build
              pnpm --filter @dependfix/engine build
              pnpm --filter dependfix build
              pnpm --filter @dependfix/platform exec nuxt prepare
            typecheck-command: pnpm --filter @dependfix/platform typecheck
            build-command: pnpm --filter @dependfix/platform build
          - name: caomei-auth
            repository: CaoMeiYouRen/caomei-auth
            target-package: caomei-auth
            timeout-minutes: 45
            setup-command: |
              pnpm exec nuxt prepare
            typecheck-command: pnpm typecheck
            build-command: pnpm build
          - name: momei
            repository: CaoMeiYouRen/momei
            target-package: momei
            timeout-minutes: 60
            setup-command: |
              pnpm --filter @momei-blog/api-client build
              pnpm --filter momei-mcp-server build
              pnpm exec nuxt prepare
            typecheck-command: pnpm typecheck
            build-command: pnpm build
    steps:
      - name: Checkout caomei-ui (for toolchain metadata)
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # 下游须在 `Setup Node.js` **之前**检出：`cache-dependency-path` 指向 `downstream/pnpm-lock.yaml`，
      # `actions/setup-node` 解析该路径失败会直接报错退出。
      - name: Checkout downstream (${{ matrix.name }})
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: downstream
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: downstream/pnpm-lock.yaml
      - name: Resolve target version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.caomei-ui-version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(npm view caomei-ui version)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target caomei-ui version: $version"
      - name: Record downstream revision
        shell: bash
        working-directory: downstream
        run: |
          sha="$(git rev-parse HEAD)"
          echo "### ${{ matrix.name }} @ ${sha}" >> "$GITHUB_STEP_SUMMARY"
          echo "downstream ${{ matrix.repository }} @ $sha (caomei-ui target: ${{ steps.version.outputs.version }})"
      - name: Install downstream dependencies
        working-directory: downstream
        run: pnpm i --frozen-lockfile
      - name: Override caomei-ui to target version
        working-directory: downstream
        env:
          CAOMEI_UI_VERSION: ${{ steps.version.outputs.version }}
        # 被测版本通常是刚发布的 tag；下游可能配置了 minimumReleaseAge（pnpm 11），
        # 会拒绝安装「过新」的版本。兼容检查必须能安装刚发布的包，故对本步骤关闭该门槛。
        # 注意：`--config.*` 只作用于这一条 pnpm 命令，无法覆盖后续 build chain 的隐式 install。
        run: |
          pnpm --filter ${{ matrix.target-package }} add "caomei-ui@$CAOMEI_UI_VERSION" --config.minimumReleaseAge=0
          # override 会把刚发布的版本写进下游 lockfile；build chain（含 nuxt prepare 等）再次触发
          # pnpm install 时会重新校验，故对后续步骤关闭门槛。仅作用于本次 CI 工作区。
          # 必须是 `pnpm_config_` 前缀：pnpm 11 不读取 `npm_config_*`。
          echo "pnpm_config_minimum_release_age=0" >> "$GITHUB_ENV"
      # 仅验证 pnpm 已解析该配置；安装侧是否放行以 tag 触发的 typecheck / build 为准。
      - name: Assert minimumReleaseAge override
        working-directory: downstream
        run: test "$(pnpm config get minimumReleaseAge)" = "0"
      - name: Setup downstream build chain
        working-directory: downstream
        run: ${{ matrix.setup-command }}
      # build chain 可能触发隐式 install / 重解析；在 setup 之后再断言一次，确保 typecheck / build
      # 实际使用的 caomei-ui 版本就是目标版本，避免「add 后生效、setup 后回退」的静默失效。
      - name: Assert installed caomei-ui version
        working-directory: downstream
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --filter ${{ matrix.target-package }} exec node -e '
          const fs = require("node:fs")
          const expected = process.env.EXPECTED_VERSION
          const path = "node_modules/caomei-ui/package.json"
          if (!fs.existsSync(path)) {
            console.error(`caomei-ui not found at ${process.cwd()}/${path}`)
            process.exit(1)
          }
          const actual = JSON.parse(fs.readFileSync(path, "utf8")).version
          if (actual !== expected) {
            console.error(`caomei-ui version mismatch: expected ${expected}, installed ${actual}`)
            process.exit(1)
          }
          console.log(`installed caomei-ui ${actual}`)
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- installed caomei-ui **${actual}** (expected ${expected})\n`)
          }
          '
      - name: Typecheck downstream
        working-directory: downstream
        run: ${{ matrix.typecheck-command }}
      - name: Build downstream
        working-directory: downstream
        run: ${{ matrix.build-command }}
