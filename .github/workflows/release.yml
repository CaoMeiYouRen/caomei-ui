name: Release

# CI 发布：直接调用 semantic-release（与 momei / caomei-auth 同一模式）。
#
# - 版本推断 / CHANGELOG / README 与 roadmap 版本句 / 里程碑 / npm publish /
#   GitHub Release / tag 全部由 `release.config.js` 的插件链驱动；
#   workflow 不手写版本计算、不重检版本、不手工 `npm publish`。
# - npm：Trusted Publishing（OIDC，`id-token: write`），**不需要 NPM_TOKEN**。
# - GitHub：`GITHUB_TOKEN`；`persist-credentials: false` 下由 semantic-release
#   自动把 token 注入推送 URL，供 `@semantic-release/git` 回推与创建 Release。
# - 发布前保留安全告警门禁 + `pnpm verify` + 覆盖率门禁。
# - 下游兼容检查由独立 job 在发布成功后显式 dispatch：`GITHUB_TOKEN` 创建的
#   tag / release 不触发 `v*` workflow，必须用 `workflow_dispatch`。
#
# 触发：仅 `workflow_dispatch`（手动）。如需周级自动发布，参照 momei / caomei-auth
# 打开下面的 `schedule`；当前保持手动，避免无变更轮次空跑。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 12 * * 6"

# Release 作业不取消，确保发布 / 回推完整；固定 group 让所有发布 run 串行。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # npm Trusted Publishing (OIDC)
      contents: write # release commit / tag / GitHub Release
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check release branch
        run: |
          set -euo pipefail
          # 发布只允许 master；非 master 触发时显式标红，避免「绿色 run 但什么都没做」。
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::Release 只允许从 master 触发（当前 ${GITHUB_REF}）"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm i --frozen-lockfile
      - name: Security alert gate
        env:
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          # 缺 token 或 critical / high 未处置即中止（安全规范 §2.1）。
          pnpm check:security-alerts
      - name: Verify quality gates
        run: pnpm verify
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Check coverage thresholds
        run: pnpm check:coverage
      - name: Capture tags before release
        id: before
        run: |
          set -euo pipefail
          echo "tags=$(git tag | sort | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: pnpm release
      - name: Read released version
        id: version
        env:
          BEFORE_TAGS: ${{ steps.before.outputs.tags }}
        run: |
          set -euo pipefail
          # 只认本次新增的版本 tag，避免重跑 / tag 已推但 publish 失败时误判；
          # 用全量 tag 差集而不是 `--points-at HEAD`，不依赖 tag 落点（HEAD 或其父提交均可）。
          current_tags="$(git tag | sort | paste -sd, -)"
          new_tags="$(
            comm -13 \
              <(printf '%s\n' "${BEFORE_TAGS}" | tr ',' '\n' | sed '/^$/d' | sort) \
              <(printf '%s\n' "${current_tags}" | tr ',' '\n' | sed '/^$/d' | sort) \
              || true
          )"
          new_tag=""
          while IFS= read -r candidate; do
            case "${candidate}" in
              v[0-9]*) new_tag="${candidate}"; break ;;
            esac
          done <<< "${new_tags}"
          version="${new_tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release"
            echo ""
            if [ -n "${version}" ]; then
              echo "- 版本：${version}"
              echo "- npm：Trusted Publishing（OIDC，无需 NPM_TOKEN）"
            else
              echo "- 本次没有新增 tag（无待发布提交，或 tag 已在发布前存在）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-downstream:
    name: Dispatch downstream compatibility
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger downstream compatibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! gh workflow run downstream-compat.yml --ref master -f "caomei-ui-version=${RELEASE_VERSION}"; then
            echo "::error::下游兼容检查 dispatch 失败；请手动执行 gh workflow run downstream-compat.yml -f caomei-ui-version=${RELEASE_VERSION}"
            exit 1
          fi
          run_url=""
          for _ in 1 2 3 4 5 6; do
            sleep 5
            run_url="$(gh run list --workflow downstream-compat.yml --event workflow_dispatch --limit 1 \
              --json url,createdAt --jq ".[0] | select(.createdAt >= \"${since}\") | .url" 2>/dev/null || true)"
            if [ -n "$run_url" ]; then
              break
            fi
          done
          {
            echo ""
            echo "- 下游兼容检查：已 dispatch（caomei-ui@${RELEASE_VERSION}）"
            if [ -n "$run_url" ]; then
              echo "- run：${run_url}"
            else
              echo "- dispatch 已提交，run 尚未可见；可在 Actions 页查看 downstream-compat"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
