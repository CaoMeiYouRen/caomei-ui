name: Test

on:
  # 仅 master 的 push 触发，避免 PR 分支同时被 push 与 pull_request 触发、
  # 同一 job 产生两条同名 check（会让 Mergify check-success 的「任一成功即满足」语义放大误判风险）。
  # 取舍：非 master 分支的纯 push 与 tag push 不再触发 Test，分支校验由 PR（pull_request）承接；
  # 需要手动重跑时用 workflow_dispatch。
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup AI mirrors
        run: pnpm setup:ai
      - name: Lint (ESLint)
        run: pnpm lint:check
      - name: Lint (Stylelint)
        run: pnpm lint:css:check
      - name: Lint (Markdown)
        run: pnpm lint:md:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck (docs)
        run: pnpm typecheck:docs
      - name: Governance checks
        run: pnpm governance:check

  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build library
        run: pnpm build
      - name: Check build artifacts
        run: pnpm check:build
      - name: Nuxt smoke
        run: pnpm check:nuxt
      - name: Build docs
        run: pnpm docs:build
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}