packages:
  - .

overrides:
  immutable: ^5.1.8
  brace-expansion@^1: ^1.1.18
  brace-expansion@^2: ^2.0.3
  brace-expansion@^5: ^5.0.7
  ajv@^6: ^6.14.0
  js-yaml: 4.3.2
  # vitepress 1.6.4 依赖 vite ^5，而 vite 5 线无法修复 esbuild 安全公告，故跨大版本覆盖到已修复的 6.4.3
  vite@^5: ^6.4.3
  flatted: ^3.4.2
  postcss: ^8.5.18
  "@humanfs/node": 0.16.8

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: false

strictPeerDependencies: false

minimumReleaseAgeExclude:
  # @lucide/vue 1.45.0 属新发布，pnpm 安装时自动加入豁免；待其超过供应链冷却期后移除
  - '@lucide/vue@1.45.0'
  # happy-dom 20.14.5 属新发布，同上；待冷却期后移除
  - happy-dom@20.14.5
