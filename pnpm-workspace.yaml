packages:
  - .

overrides:
  immutable: ^5.1.8
  brace-expansion@^1: ^1.1.18
  brace-expansion@^2: ^2.1.7
  brace-expansion@^5: ^5.0.7
  ajv@^6: ^6.14.0
  js-yaml: 4.3.2
  # vitepress 1.6.4 依赖 vite ^5，而 vite 5 线无法修复 esbuild 安全公告，故跨大版本覆盖到 6.x；
  # 6.4.4 起修复 launch-editor 相关三条开发作用域公告（GHSA-587h-7wmj-h5pm / GHSA-r825-w8mm-5pxw / GHSA-698v-4r3x-3vcv）
  vite@^5: ^6.4.4
  # GHSA-gfr2-rv44-r23c（high）/ GHSA-vfgh-jcmw-g37q（low）：markdown-it < 14.3.3 的二次复杂度拒绝服务
  # 传递链 md-editor-v3（富文本可选 peer）→ markdown-it；属运行时作用域，须保持清零
  markdown-it@<14.3.3: 14.3.3
  # GHSA-587h-7wmj-h5pm / GHSA-r825-w8mm-5pxw / GHSA-698v-4r3x-3vcv：launch-editor <= 2.14.1
  launch-editor@<2.14.2: 2.14.2
  flatted: ^3.4.2
  postcss: ^8.5.18
  # GHSA-68fv-2mgg-jv7q：source-map-js < 1.2.2 存在经索引 source-map 段偏移的事件循环拒绝服务（Dependabot high）
  source-map-js: ^1.2.2
  # Phase 22 M2-2：开发作用域安全告警处置（均为传递依赖）
  handlebars: ^4.7.10
  shell-quote: ^1.12.0
  devalue: ^5.9.3
  # GHSA-m5mm-p8h7-m29v：serialize-javascript < 7.1.3 的 XSS
  serialize-javascript: ^7.1.4
  # GHSA-xjj6-f33q-929c：undici < 6.29.1 / < 7.30.1 / < 8.12.2 的过量错误拒绝服务（按大版本分别收敛）
  undici@^6: ^6.29.1
  undici@^7: ^7.30.1
  undici@^8: ^8.12.3
  # GHSA-w74x-v6f9-j3xg / GHSA-xhq7-xmqj-769h / GHSA-wjr9-j795-jxcr / GHSA-333x-w4r6-6crp：fast-uri < 3.1.9
  fast-uri@^3: ^3.1.9
  # GHSA-86w9-cpqp-85rv：node-forge <= 1.4.0 的 RSA 签名伪造（1.4.1 起修复，取 1.4.2）
  node-forge: ^1.4.2
  # simple-git 覆盖与补丁已随 nuxt 4.6.3 移除：@nuxt/devtools 3.4.4 起不再依赖 simple-git
  "@humanfs/node": 0.16.8

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: false

strictPeerDependencies: false

minimumReleaseAgeExclude:
  # happy-dom 20.14.5 属新发布，同上；待冷却期后移除
  - happy-dom@20.14.5
  - node-forge@1.4.2
